# SonarCloud Configuration for Sentence Generator Worker (Backend)

# Project identification
sonar.projectKey=JaunLast_sentence-generator-worker
sonar.organization=jaunlast

# Project metadata
sonar.projectName=Sentence Generator Worker
sonar.projectVersion=1.0

# Source code settings
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Exclude files from analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/.wrangler/**,\
  **/wrangler.toml

# Test coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.spec.ts

# TypeScript settings
sonar.typescript.file.suffixes=.ts

# Code quality settings
sonar.sourceEncoding=UTF-8

# Duplication exclusions
sonar.cpd.exclusions=\
  **/*.test.ts,\
  **/*.spec.ts

# Analysis parameters
sonar.scm.provider=git
