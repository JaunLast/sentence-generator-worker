name = "sentence-generator-worker"
main = "src/index.ts"
compatibility_date = "2023-12-01"

# Cloudflare AI binding
[ai]
binding = "AI"

# Local development configuration
[[d1_databases]]
binding = "DB"
database_name = "sentence-generator-db"
database_id = "3e8a01f2-d867-4b7b-bece-1597c96db37f"

[vars]
JWT_SECRET = "local-dev-secret-key-change-this-in-production"

[observability]
enabled = true

# Production environment
[env.production]
name = "sentence-generator-worker"

[[env.production.d1_databases]]
binding = "DB"
database_name = "sentence-generator-db"
database_id = "3e8a01f2-d867-4b7b-bece-1597c96db37f"

# Staging environment
[env.staging]
name = "sentence-generator-worker-staging"


[env.staging.ai]
binding = "AI"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "sentence-generator-db-staging"
database_id = "950592de-1f99-4bf4-bb6e-209b0ac68079"
